name: Test operator discovery address

on:
  pull_request:
    paths:
      - helm/stunner/**
      - .github/scripts/test_operator_service_address.py
      - .github/workflows/test-operator-service-address.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.18.6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - run: helm dependency build helm/stunner
      - run: python .github/scripts/test_operator_service_address.py
