name: Lint Helm charts

on:
  workflow_dispatch:
  push:
    branches:
      - '*'
    tags-ignore:
      - '*'
  pull_request:
    branches: [ main ]


jobs:
  linter:
    runs-on: ubuntu-latest
    steps:
      - name: stunner-helm checkout
        uses: actions/checkout@v6
        with:
          path: stunner-helm
          ref: main
          repository: l7mp/stunner-helm

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2

      - name: Verify README image fields are in sync
        run: |
          python3 stunner-helm/.github/scripts/sync_readme_image_rows.py \
            --readme stunner-helm/helm/stunner/README.md \
            --values stunner-helm/helm/stunner/values.yaml \
            --check

      - name: Run chart-testing (lint)
        run: |
          cd stunner-helm
          ct lint --chart-dirs helm --charts helm/stunner
